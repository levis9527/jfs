# jfs 启动参数备忘
#
# 本文件不会被进程自动加载，请把下面的值抄到命令行：
#
#   java -jar target/jfs-0.1.0-SNAPSHOT.jar \
#     -addr :8080 \
#     -data ./data \
#     -volumes 2 \
#     -volume-size 1073741824 \
#     -worker 1 \
#     -token change-me
#
# 完整说明见 docs/startup.md

addr=:8080
data=./data
volumes=2
volume-size=1073741824
worker=1
token=change-me
